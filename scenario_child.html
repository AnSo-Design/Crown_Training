<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nordic Crown — Emergency Training</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f4f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 3rem;
  }

  .top-bar {
    width: 100%;
    background: #c0392b;
    padding: 1rem 1.25rem 0.85rem;
    color: white;
    position: relative;
  }

  .top-bar .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 2px;
  }

  .top-bar .title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
    padding-right: 80px;
  }

  .top-bar .location {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 3px;
  }

  .lang-switcher {
    position: absolute;
    top: 1rem;
    right: 1.25rem;
    display: flex;
    gap: 5px;
  }

  .lang-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    color: white;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .lang-btn.active {
    background: rgba(255,255,255,0.4);
    border-color: white;
  }

  .lang-btn:active { background: rgba(255,255,255,0.5); }

  .progress-wrap {
    background: rgba(255,255,255,0.3);
    border-radius: 99px;
    height: 3px;
    margin-top: 12px;
  }

  .progress-fill {
    height: 3px;
    border-radius: 99px;
    background: white;
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 1.25rem;
  }

  .step-label {
    font-size: 15px;
    color: #888;
    text-align: center;
    margin-bottom: 1rem;
    letter-spacing: 0.03em;
  }

  .scene-card {
    background: white;
    border-radius: 14px;
    padding: 1rem 1.125rem;
    margin-bottom: 1rem;
    border: 1px solid #e8e6e0;
  }

  .scene-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 6px;
  }

  .scene-text {
    font-size: 15px;
    color: #222;
    line-height: 1.65;
  }

  .question-label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 10px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .choice-btn {
    width: 100%;
    text-align: left;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 14px;
    color: #222;
    cursor: pointer;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: background 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .choice-btn:active { background: #f4f4f2; }

  .choice-btn.correct {
    border-color: #2e9e5b;
    background: #f0faf4;
  }

  .choice-btn.wrong {
    border-color: #c0392b;
    background: #fdf2f1;
  }

  .choice-btn:disabled { cursor: default; }

  .choice-letter {
    font-size: 11px;
    font-weight: 600;
    color: #bbb;
    min-width: 16px;
    padding-top: 2px;
    flex-shrink: 0;
  }

  .choice-btn.correct .choice-letter { color: #2e9e5b; }
  .choice-btn.wrong .choice-letter { color: #c0392b; }

  .feedback-card {
    border-radius: 12px;
    padding: 0.875rem 1rem;
    margin-top: 1rem;
    border: 1px solid;
  }

  .feedback-card.correct {
    background: #f0faf4;
    border-color: #a8dfc0;
  }

  .feedback-card.wrong {
    background: #fdf2f1;
    border-color: #f5c0ba;
  }

  .feedback-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  .feedback-card.correct .feedback-title { color: #1e7a42; }
  .feedback-card.wrong .feedback-title { color: #a0291e; }

  .feedback-text {
    font-size: 13px;
    line-height: 1.6;
    color: #555;
  }

  .next-btn {
    width: 100%;
    padding: 0.875rem;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1rem;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .next-btn:active { background: #a0291e; }

  .intro-wrap { text-align: center; padding-top: 0.5rem; }

  .intro-badge {
    display: inline-block;
    background: #fdf2f1;
    color: #a0291e;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 99px;
    margin-bottom: 1rem;
    border: 1px solid #f5c0ba;
  }

  .intro-title {
    font-size: 21px;
    font-weight: 700;
    color: #222;
    line-height: 1.25;
    margin-bottom: 0.75rem;
  }

  .intro-desc {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .intro-meta {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-bottom: 1.75rem;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .meta-value {
    font-size: 20px;
    font-weight: 700;
    color: #222;
  }

  .meta-label {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .start-btn {
    width: 100%;
    padding: 1rem;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .start-btn:active { background: #a0291e; }

  .summary-wrap { text-align: center; padding-top: 0.5rem; }

  .summary-score {
    font-size: 52px;
    font-weight: 700;
    color: #222;
    line-height: 1;
    margin: 0.5rem 0 0.25rem;
  }

  .summary-sub {
    font-size: 14px;
    color: #888;
    margin-bottom: 1.5rem;
  }

  .reminder-card {
    background: #fffbf0;
    border: 1px solid #f0d080;
    border-radius: 12px;
    padding: 0.875rem 1rem;
    margin-bottom: 1rem;
    font-size: 13px;
    color: #7a5c00;
    line-height: 1.55;
  }

  .reminder-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #b07800;
    margin-bottom: 4px;
  }

  .review-list {
    background: white;
    border-radius: 12px;
    border: 1px solid #e8e6e0;
    overflow: hidden;
    margin-bottom: 1rem;
    text-align: left;
  }

  .review-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #f0eeea;
  }

  .review-item:last-child { border-bottom: none; }

  .review-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .review-dot.correct { background: #2e9e5b; }
  .review-dot.wrong { background: #c0392b; }

  .review-text {
    font-size: 13px;
    color: #555;
    line-height: 1.4;
  }

  .divider {
    height: 1px;
    background: #e8e6e0;
    margin: 1.25rem 0;
  }

  .restart-btn {
    width: 100%;
    padding: 0.75rem;
    background: transparent;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 14px;
    color: #222;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 0.75rem;
  }

  .restart-btn:active { background: #eee; }


  .note-card {
    background: #fffbf0;
    border: 1px solid #f0d080;
    border-radius: 12px;
    padding: 0.875rem 1rem;
    margin-top: 1rem;
    font-size: 13px;
    color: #7a5c00;
    line-height: 1.55;
  }

  .note-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #b07800;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progress"></div>
  </div>
</div>

<div class="container" id="content"></div>

          { text: "Berätta för Lucas att om han följer med dig till mönstringsplatsen kan zonledaren hjälpa honom att hitta sina föräldrar", correct: true, feedback: "Ja, zonledaren kan kommunicera med andra för att hitta hans föräldrar och återförena dem." },
          { text: "Lova Lucas att du personligen hittar hans föräldrar och tar med dem till honom om han följer med nu", correct: false, feedback: "Det är riskabelt att ge löften du inte kan hålla. Du har ingen radio, du kan inte lämna Lucas och du kan inte garantera att du hittar hans föräldrar. Det här bör hanteras av din zonledare." }
        ]
      },
      {
        scene: "Lucas går med på att följa med dig. Du tar hans hand och kliver ut i korridoren.",
        question: "Vad gör du härnäst?",
        choices: [
          { text: "Slutför din fullständiga hyttgenomgång först och ta sedan Lucas till zonledaren i slutet", correct: false, feedback: "Att avsluta genomgången innan du överlämnar Lucas försenar viktig information till zonledaren. Hans föräldrar kanske redan är vid mönstringsplatsen och är oroliga för sitt barn. Överlämningen tar bara några minuter — gör det först och gå sedan tillbaka till din genomgång." },
          { text: "Lämna Lucas i korridoren och fortsätt din genomgång — han är gammal nog att hitta mönstringsplatsen på egen hand", correct: false, feedback: "En 8-åring ensam i en korridor under ett aktivt evakueringslarm är inte säkert. Han känner inte till fartyget, han är redan rädd och att lämna honom utan sällskap kan göra situationen betydligt värre." },
          { text: "Ta Lucas direkt till zonledaren vid mönstringsplatsen, överlämna honom, förklara situationen och återvänd sedan för att fortsätta din hyttgenomgång", correct: true, feedback: "Zonledaren har radion, befogenheten och överblicken för att hantera ett barn utan sällskap och hitta hans föräldrar. Mönstringsplatsen är nära, överlämningen går snabbt och du kan återvända till din genomgång omedelbart." }
        ]
      }
    ]
  }
};

// ─── STATE ────────────────────────────────────────────────────────────────────

let lang = 'en';
let current = -1; // -1 = intro, 0..n = steps, n+1 = summary
let selected = null;
let results = [];
let shuffledSteps = [];

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function setProgress(pct) {
  document.getElementById('progress').style.width = pct + '%';
}

function updateLangButtons() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────

function render() {
  const content = document.getElementById('content');
  const switcher = document.getElementById('lang-switcher');

  switcher.style.display = 'flex';
  updateLangButtons();

  if (current <= -1) { renderIntro(content); return; }

  const steps = shuffledSteps;
  if (current >= steps.length) { renderSummary(content); return; }

  setProgress((current / steps.length) * 100);
  const step = steps[current];
  const answered = selected !== null;
  const letters = ['A','B','C','D'];
  const T = t[lang];

  const choicesHTML = step.choices.map((c, i) => {
    let cls = 'choice-btn';
    if (answered) {
      if (c.correct) cls += ' correct';
      else if (i === selected) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="choose(${i})" ${answered ? 'disabled' : ''}>
      <span class="choice-letter">${letters[i]}</span>
      <span>${c.text}</span>
    </button>`;
  }).join('');

  let feedbackHTML = '';
  if (answered) {
    const c = step.choices[selected];
    const isLast = current === steps.length - 1;
    feedbackHTML = `
      <div class="feedback-card ${c.correct ? 'correct' : 'wrong'}">
        <div class="feedback-title">${c.correct ? T.correct : T.wrong}</div>
        <div class="feedback-text">${c.feedback}</div>
      </div>
      <button class="next-btn" onclick="next()">${isLast ? T.seeResults : T.next}</button>`;
  }

  document.getElementById('bar-title').textContent = T.barTitle;

  content.innerHTML = `
    <div class="step-label">${T.situationOf(current + 1, steps.length)}</div>
    <div class="scene-card">
      <div class="scene-label">${T.situationLabel}</div>
      <div class="scene-text">${step.scene}</div>
    </div>
    <div class="question-label">${step.question}</div>
    <div class="choices">${choicesHTML}</div>
    <div id="feedback">${feedbackHTML}</div>`;
}


function renderIntro(content) {
  setProgress(0);
  const T = t[lang];
  document.getElementById('bar-title').textContent = T.barTitle;
  content.innerHTML = `
    <div class="intro-wrap">
      <div class="intro-badge">${T.introBadge}</div>
      <div class="intro-title">${T.introTitle}</div>
      <div class="intro-desc">${T.introDesc}</div>
      <div class="intro-meta">
        <div class="meta-item">
          <div class="meta-value">3</div>
          <div class="meta-label">${T.situations}</div>
        </div>
        <div class="meta-item">
          <div class="meta-value">${T.duration}</div>
          <div class="meta-label">${T.durationLabel}</div>
        </div>
      </div>
      <button class="start-btn" onclick="startScenario()">${T.start}</button>
    </div>`;
}

function renderSummary(content) {
  setProgress(100);
  const T = t[lang];
  document.getElementById('bar-title').textContent = T.barTitleResults;
  const score = results.filter(r => r.correct).length;
  const total = results.length;
  const msg = T.scoreMsg(score, total);

  const reviewItems = results.map((r, i) => `
    <div class="review-item">
      <div class="review-dot ${r.correct ? 'correct' : 'wrong'}"></div>
      <div class="review-text">${T.situationN(i + 1)} — ${r.correct ? T.correctResponse : T.reviewRecommended}</div>
    </div>`).join('');

  content.innerHTML = `
    <div class="summary-wrap">
      <div class="step-label">${T.scenarioComplete}</div>
      <div class="summary-score">${score}/${total}</div>
      <div class="summary-sub">${msg}</div>
    </div>
    <div class="reminder-card">
      <div class="reminder-label">${T.keepInMindLabel}</div>
      ${T.keepInMind}
    </div>
    <div class="review-list">${reviewItems}</div>
    <div class="divider"></div>
    <button class="restart-btn" onclick="restart()">${T.restart}</button>`;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────

function selectLang(l) {
  lang = l;
  updateLangButtons();
  renderIntro(document.getElementById('content'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchLang(l) {
  lang = l;
  // Re-render current screen in new language, keeping progress
  // If mid-scenario and a choice is already selected, keep that state
  render();
  updateLangButtons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startScenario() {
  current = 0;
  selected = null;
  results = [];
  // Deep copy and shuffle choices for current language
  shuffledSteps = t[lang].steps.map(step => ({
    ...step,
    choices: [...step.choices].sort(() => Math.random() - 0.5)
  }));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function choose(i) {
  if (selected !== null) return;
  selected = i;
  results.push({ correct: shuffledSteps[current].choices[i].correct });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() {
  current++;
  selected = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  current = -1;
  selected = null;
  results = [];
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
